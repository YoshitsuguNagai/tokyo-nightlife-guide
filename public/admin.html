<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 | Tokyo Nightlife Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a227;--bg:#0f0f10;--bg2:#171719;--bg3:#212124;--line:#2c2c30;--txt:#eee;--sub:#9a968c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans JP','Hiragino Sans',Arial,sans-serif;font-size:14px;line-height:1.7}
a{color:var(--gold)}
.layout{display:flex;min-height:100vh}
.side{width:216px;background:var(--bg2);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.side h1{font-size:14px;color:var(--gold);padding:8px 10px;margin-bottom:10px;letter-spacing:.06em}
.side a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;color:var(--sub);cursor:pointer;font-size:13px;position:relative}
.side a.on,.side a:hover{background:var(--bg3);color:var(--txt)}
.pend{position:absolute;right:10px;background:#c0392b;color:#fff;font-size:10px;border-radius:10px;padding:1px 7px;font-weight:700}
.main{flex:1;padding:22px;overflow:auto;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.top h2{font-size:19px;letter-spacing:.04em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat b{font-size:26px;color:var(--gold);font-weight:700}
.stat.alert{border-color:#c0392b}
.stat.alert b{color:#e74c3c}
.notice{background:rgba(192,57,43,.12);border:1px solid #c0392b;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:10px;overflow:hidden;margin-top:12px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}
th{color:var(--sub);background:var(--bg3);white-space:nowrap}
td{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#141414;border:0;border-radius:8px;padding:9px 17px;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit}
.btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:5px 11px;font-size:11px;min-height:32px}
.btn.danger{background:#7a2626;color:#fff}
.btn.tr{background:#1f3a5f;color:#cfe3ff;border:1px solid #2d4f7c}
input,textarea,select{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:13px;font-family:inherit;min-height:38px}
input:focus,textarea:focus,select:focus{outline:1px solid var(--gold)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.frm .full{grid-column:1/-1}
.frm label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;letter-spacing:.03em}
.help{font-size:10.5px;color:#7a766c;margin-top:3px}
.trbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:rgba(201,162,39,.06);border:1px dashed #4a3d1c;border-radius:8px;padding:8px 12px}
.trbar span{font-size:11px;color:var(--sub)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;z-index:50;overflow:auto}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:780px}
.modal h3{font-size:16px}
.searchbar{display:flex;gap:8px;margin-top:12px}
.searchbar input{max-width:300px}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;white-space:nowrap}
.badge.pub{background:#1e3a1e;color:#8f8}.badge.pen{background:#3a3318;color:#fc6}.badge.hide{background:#333;color:#999}.badge.rej{background:#3a1e1e;color:#f88}
.upzone{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.upzone img{width:110px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000}
.upzone input[type=file]{display:none}
.uplabel{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px dashed var(--line);border-radius:8px;padding:9px 14px;font-size:12px;color:var(--sub);cursor:pointer;min-height:38px}
.uplabel:hover{border-color:var(--gold);color:var(--gold2)}
.cbg{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.cbg label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--txt);cursor:pointer;margin:0}
.cbg input{width:auto;min-height:0}
.login-wrap{max-width:370px;margin:110px auto;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:30px}
.login-wrap h1{color:var(--gold);font-size:18px;margin-bottom:18px}
.login-wrap .field{margin-bottom:11px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--gold);color:#141414;padding:11px 24px;border-radius:24px;font-weight:700;z-index:99}
@media(max-width:820px){.side{width:60px;padding:12px 6px}.side a span,.side h1 span{display:none}.side a{justify-content:center}.pend{right:4px;top:4px}.frm{grid-template-columns:1fr}.main{padding:14px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
let TOKEN = localStorage.tng_admin_token || '';
let VIEW = 'dashboard';
let STATS = null, AREAS = [], STORES = [];
const API = (p, o) => fetch(p, { ...o, headers: { 'Content-Type':'application/json', Authorization:'Bearer '+TOKEN } }).then(async r => {
  if (r.status === 401) { TOKEN=''; localStorage.removeItem('tng_admin_token'); render(); throw new Error('auth'); }
  return r.json();
});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const d = document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ---------- フィールド定義 ----------
 type: text(既定) / number / textarea / select / bool / image / paychecks / area / store
 tr: 翻訳グループ名 (xxx_ja→xxx_en/xxx_zh に自動翻訳バーを表示) */
const ST_OPTS = { published:'公開', hidden:'非公開' };
const BOOL_OPTS = { 1:'する', 0:'しない' };
const PAY_OPTS = ['現金','VISA','Mastercard','AMEX','JCB','Diners','電子マネー','QR決済','その他'];
const F = {
 stores:[
  {k:'name_ja',l:'店舗名（日本語）',tr:'name'},{k:'name_en',l:'店舗名（English）',trg:'name'},{k:'name_zh',l:'店舗名（中文）',trg:'name'},
  {k:'area_id',l:'エリア',type:'area'},
  {k:'genre',l:'ジャンル',type:'select',opts:{cabaret:'キャバクラ',lounge:'ラウンジ',club:'クラブ'}},
  {k:'desc_ja',l:'店舗紹介（日本語）',type:'textarea',tr:'desc'},{k:'desc_en',l:'店舗紹介（English）',type:'textarea'},{k:'desc_zh',l:'店舗紹介（中文）',type:'textarea'},
  {k:'cover_image',l:'店舗写真',type:'image'},{k:'logo',l:'ロゴ',type:'image'},
  {k:'hue',l:'写真未設定時のテーマ色（0〜360）',type:'number'},
  {k:'address',l:'住所'},
  {k:'google_map_url',l:'Googleマップ URL',help:'Googleマップで店舗を開く →「共有」→「リンクをコピー」。未入力でも住所から地図を表示します。'},
  {k:'open_hours',l:'営業時間（例: 20:00 - 01:00）'},{k:'closed_days',l:'定休日（例: 日曜・祝日）'},
  {k:'phone',l:'電話番号'},
  {k:'line_url',l:'LINE公式アカウント URL',help:'LINE Official Account Manager の「友だち追加URL」(https://line.me/...) を貼り付け。店舗ページに「LINEで問い合わせ」ボタンが表示されます。'},
  {k:'instagram',l:'Instagram URL'},{k:'website',l:'公式Webサイト URL'},
  {k:'budget_min',l:'予算・下限（円）',type:'number'},{k:'budget_max',l:'予算・上限（円）',type:'number'},
  {k:'charge',l:'チャージ（例: ¥10,000）'},{k:'service_fee',l:'サービス料（例: 20%）'},
  {k:'payment_methods',l:'支払い方法（複数選択可）',type:'paychecks'},
  {k:'cast_count',l:'キャスト数',type:'number'},
  {k:'foreigner_welcome',l:'外国人歓迎',type:'bool'},{k:'english_ok',l:'英語対応',type:'bool'},{k:'chinese_ok',l:'中国語対応',type:'bool'},
  {k:'credit_card_ok',l:'クレジットカード対応',type:'bool'},{k:'reservation_ok',l:'予約可否',type:'bool'},
  {k:'is_recommended',l:'おすすめ店舗に表示',type:'bool'},
  {k:'sort_order',l:'掲載順位（小さいほど先頭）',type:'number'},
  {k:'status',l:'掲載ステータス',type:'select',opts:ST_OPTS}],
 casts:[
  {k:'store_id',l:'在籍店舗',type:'store'},
  {k:'name',l:'名前（本名・管理用）'},{k:'display_name',l:'表示名'},
  {k:'photo',l:'写真',type:'image'},{k:'hue',l:'写真未設定時のテーマ色（0〜360）',type:'number'},
  {k:'profile_ja',l:'プロフィール（日本語）',type:'textarea',tr:'profile'},{k:'profile_en',l:'プロフィール（English）',type:'textarea'},{k:'profile_zh',l:'プロフィール（中文）',type:'textarea'},
  {k:'height',l:'身長（cm）',type:'number'},{k:'hobbies',l:'趣味'},{k:'favorites',l:'好きなもの'},
  {k:'languages',l:'話せる言語（例: ja,en,zh）'},
  {k:'english_ok',l:'英語対応',type:'bool'},{k:'chinese_ok',l:'中国語対応',type:'bool'},
  {k:'recommend_ja',l:'おすすめコメント（日本語）',tr:'recommend'},{k:'recommend_en',l:'おすすめコメント（English）'},{k:'recommend_zh',l:'おすすめコメント（中文）'},
  {k:'sns_instagram',l:'Instagram URL'},
  {k:'is_popular',l:'人気キャストに表示',type:'bool'},{k:'sort_order',l:'掲載順',type:'number'},
  {k:'status',l:'掲載ステータス',type:'select',opts:ST_OPTS}],
 areas:[{k:'slug',l:'スラッグ（英小文字 例: roppongi）'},{k:'name_ja',l:'名前（日本語）',tr:'name'},{k:'name_en',l:'名前（English）'},{k:'name_zh',l:'名前（中文）'},{k:'sort_order',l:'表示順',type:'number'},{k:'status',l:'ステータス',type:'select',opts:ST_OPTS}],
 events:[
  {k:'store_id',l:'開催店舗',type:'store'},
  {k:'title_ja',l:'イベント名（日本語）',tr:'title'},{k:'title_en',l:'イベント名（English）'},{k:'title_zh',l:'イベント名（中文）'},
  {k:'desc_ja',l:'説明（日本語）',type:'textarea',tr:'desc'},{k:'desc_en',l:'説明（English）',type:'textarea'},{k:'desc_zh',l:'説明（中文）',type:'textarea'},
  {k:'event_date',l:'開催日（YYYY-MM-DD）'},{k:'start_time',l:'開始時間（例: 20:00）'},{k:'end_time',l:'終了時間'},
  {k:'image',l:'イベント画像',type:'image'},{k:'hue',l:'画像未設定時のテーマ色',type:'number'},
  {k:'status',l:'公開状態',type:'select',opts:ST_OPTS}],
 coupons:[
  {k:'store_id',l:'対象店舗',type:'store'},
  {k:'title_ja',l:'クーポン名（日本語）',tr:'title'},{k:'title_en',l:'クーポン名（English）'},{k:'title_zh',l:'クーポン名（中文）'},
  {k:'desc_ja',l:'説明（日本語）',type:'textarea',tr:'desc'},{k:'desc_en',l:'説明（English）',type:'textarea'},{k:'desc_zh',l:'説明（中文）',type:'textarea'},
  {k:'conditions_ja',l:'利用条件（日本語）',tr:'conditions'},{k:'conditions_en',l:'利用条件（English）'},{k:'conditions_zh',l:'利用条件（中文）'},
  {k:'code',l:'クーポンコード'},{k:'valid_until',l:'有効期限（YYYY-MM-DD）'},
  {k:'image',l:'クーポン画像',type:'image'},{k:'hue',l:'画像未設定時のテーマ色',type:'number'},
  {k:'status',l:'公開状態',type:'select',opts:ST_OPTS}],
 blogs:[
  {k:'slug',l:'スラッグ（URL用・英小文字）'},{k:'category',l:'カテゴリー'},
  {k:'title_ja',l:'タイトル（日本語）',tr:'title'},{k:'title_en',l:'タイトル（English）'},{k:'title_zh',l:'タイトル（中文）'},
  {k:'body_ja',l:'本文（日本語）',type:'textarea',tr:'body'},{k:'body_en',l:'本文（English）',type:'textarea'},{k:'body_zh',l:'本文（中文）',type:'textarea'},
  {k:'seo_title',l:'SEO タイトル'},{k:'seo_description',l:'SEO 説明文'},
  {k:'image',l:'アイキャッチ画像',type:'image'},{k:'hue',l:'画像未設定時のテーマ色',type:'number'},
  {k:'status',l:'公開状態',type:'select',opts:ST_OPTS}],
 reviews:[
  {k:'store_id',l:'店舗',type:'store'},
  {k:'author_name',l:'投稿者名'},{k:'rating',l:'星（1〜5）',type:'number'},
  {k:'title',l:'タイトル'},{k:'body',l:'本文',type:'textarea'},
  {k:'visit_date',l:'利用日'},{k:'language',l:'投稿言語',type:'select',opts:{ja:'日本語',en:'English',zh:'中文'}},
  {k:'status',l:'承認状態',type:'select',opts:{pending:'未承認',approved:'承認（公開）',rejected:'非承認',hidden:'非表示'}}],
 users:[{k:'name',l:'名前'},{k:'email',l:'メールアドレス'},{k:'country',l:'国'},{k:'language',l:'使用言語',type:'select',opts:{ja:'日本語',en:'English',zh:'中文'}},{k:'role',l:'権限',type:'select',opts:{user:'ユーザー',store:'店舗',admin:'管理者'}},{k:'store_id',l:'店舗（店舗権限の場合）',type:'store'},{k:'is_blocked',l:'アカウント停止',type:'select',opts:{0:'有効',1:'停止中'}}],
 notifications:[{k:'store_id',l:'店舗',type:'store'},{k:'user_id',l:'送信先ユーザーID（空=全員）',type:'number'},{k:'template_ja',l:'メッセージ（日本語）',type:'textarea',tr:'template'},{k:'template_en',l:'メッセージ（English）',type:'textarea'},{k:'template_zh',l:'メッセージ（中文）',type:'textarea'},{k:'channel',l:'送信チャネル',type:'select',opts:{dm:'DM',email:'メール',line:'LINE'}},{k:'status',l:'状態',type:'select',opts:{draft:'下書き',sent:'送信済み'}}],
 settings:[{k:'key',l:'キー'},{k:'value',l:'値',type:'textarea'}]
};
const MENU = [['dashboard','▦','Dashboard'],['stores','◆','店舗'],['casts','◇','キャスト'],['areas','◎','エリア'],['users','◉','ユーザー'],['reviews','★','口コミ'],['messages','✉','DM'],['blogs','▤','ブログ'],['events','▣','イベント'],['coupons','▢','クーポン'],['notifications','♪','お礼・通知'],['settings','⚙','サイト設定']];

async function render(){
  const root = document.getElementById('root');
  if (!TOKEN) {
    root.innerHTML = `<div class="login-wrap"><h1>◆ TNG 管理画面</h1>
      <div class="field"><label style="font-size:11px;color:var(--sub)">メールアドレス</label><input id="le" value="admin@tng.jp"></div>
      <div class="field"><label style="font-size:11px;color:var(--sub)">パスワード</label><input id="lp" type="password" placeholder="初期: admin123（必ず変更）"></div>
      <button class="btn" style="width:100%" onclick="login()">ログイン</button></div>`;
    return;
  }
  STATS = await API('/api/admin/stats').catch(()=>null);
  if (!STATS) return;
  AREAS = await API('/api/admin/areas'); STORES = await API('/api/admin/stores');
  const pend = STATS.pending_reviews || 0;
  root.innerHTML = `<div class="layout"><nav class="side"><h1>◆ <span>TNG Admin</span></h1>
    ${MENU.map(m=>`<a class="${VIEW===m[0]?'on':''}" onclick="go('${m[0]}')">${m[1]} <span>${m[2]}</span>${m[0]==='reviews'&&pend?`<b class="pend">${pend}</b>`:''}</a>`).join('')}
    <a onclick="localStorage.removeItem('tng_admin_token');TOKEN='';render()">⏻ <span>ログアウト</span></a>
    <a href="/" target="_blank">↗ <span>サイトを見る</span></a></nav>
    <main class="main" id="main"></main></div>`;
  const main = document.getElementById('main');
  if (VIEW === 'dashboard') {
    main.innerHTML = `<div class="top"><h2>Dashboard</h2></div>
    ${pend?`<div class="notice">★ 未承認の口コミが <b>${pend}件</b> あります。<a href="javascript:go('reviews')">口コミ管理で確認する →</a></div>`:''}
    <div class="cards">
      <div class="stat ${pend?'alert':''}"><div style="color:var(--sub);font-size:11px">未承認口コミ</div><b>${pend}</b></div>
      ${[['店舗',STATS.stores],['キャスト',STATS.casts],['ユーザー',STATS.users],['口コミ(総数)',STATS.reviews],['DM',STATS.messages],['イベント',STATS.events],['クーポン',STATS.coupons],['ブログ',STATS.blogs]]
        .map(x=>`<div class="stat"><div style="color:var(--sub);font-size:11px">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div>
      <p style="margin-top:18px;color:var(--sub);font-size:12px;line-height:2">左メニューから各データを追加・編集・削除できます。<br>多言語項目は「日本語」を入力して <b>自動翻訳</b> ボタンを押すと英語・中国語が自動入力されます（内容は後から修正できます）。<br>画像は「ファイルを選択」からアップロードできます（Cloudinary設定で永続保存。README参照）。</p>`;
    return;
  }
  if (VIEW === 'messages') return renderMessages(main);
  return renderTable(main, VIEW);
}
function go(v){ VIEW = v; render(); }
async function login(){
  const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email: document.getElementById('le').value, password: document.getElementById('lp').value }) }).then(r=>r.json());
  if (r.error || r.user.role !== 'admin') return toast('管理者アカウントでログインしてください');
  TOKEN = r.token; localStorage.tng_admin_token = TOKEN; render();
}

const badge = s => s ? `<span class="badge ${s==='published'||s==='approved'?'pub':s==='pending'?'pen':s==='rejected'?'rej':'hide'}">${esc(({published:'公開',hidden:'非公開',approved:'承認',pending:'未承認',rejected:'非承認',draft:'下書き',sent:'送信済み'})[s]||s)}</span>` : '';
const short = v => v == null ? '' : String(v).slice(0, 42);

async function renderTable(main, table){
  const rows = await API('/api/admin/' + table);
  main.innerHTML = tableHtml(table, rows);
}
function tableHtml(table, rows){
  const fields = F[table] || [];
  const cols = table === 'settings' ? ['key','value'] : ['id', ...fields.slice(0,4).map(f=>f.k), 'status'];
  const pend = table==='reviews' ? rows.filter(r=>r.status==='pending').length : 0;
  return `<div class="top"><h2>${esc((MENU.find(m=>m[0]===table)||['','',''])[2])}</h2>
    <button class="btn" onclick="editRow('${table}',null)">＋ 新規追加</button></div>
    ${pend?`<div class="notice">未承認の口コミが <b>${pend}件</b> あります。「承認」に変更して保存するとサイトに公開されます。</div>`:''}
    <div class="searchbar"><input id="q" placeholder="検索..." onkeydown="if(event.key==='Enter')doSearch('${table}')"><button class="btn ghost sm" onclick="doSearch('${table}')">検索</button></div>
    <div style="overflow:auto"><table><tr>${cols.map(c=>`<th>${esc((fields.find(f=>f.k===c)||{}).l||c)}</th>`).join('')}<th>操作</th></tr>
    ${rows.map(r=>`<tr>${cols.map(c=>`<td>${c==='status'?badge(r[c]):c==='area_id'?esc((AREAS.find(a=>a.id===r[c])||{}).name_ja||r[c]||''):c==='store_id'?esc((STORES.find(s=>s.id===r[c])||{}).name_ja||r[c]||''):esc(short(r[c]))}</td>`).join('')}
      <td style="white-space:nowrap"><button class="btn ghost sm" onclick='editRow("${table}",${r.id||JSON.stringify(r.key)})'>編集</button>
      ${table==='reviews'&&r.status==='pending'?`<button class="btn sm" onclick="quickApprove(${r.id})">承認</button>`:''}
      ${table!=='settings'?`<button class="btn danger sm" onclick="delRow('${table}',${r.id})">削除</button>`:''}</td></tr>`).join('')}</table></div>`;
}
async function doSearch(table){
  const q = document.getElementById('q').value;
  const rows = await API('/api/admin/' + table + '?q=' + encodeURIComponent(q));
  document.getElementById('main').innerHTML = tableHtml(table, rows);
  document.getElementById('q').value = q;
}
async function quickApprove(id){
  await API('/api/admin/reviews/' + id, { method:'PUT', body: JSON.stringify({ status:'approved' }) });
  toast('口コミを承認しました'); render();
}
window._rows = {};
async function editRow(table, id){
  const rows = await API('/api/admin/' + table);
  const row = id == null ? null : rows.find(r => String(r.id ?? r.key) === String(id));
  const fields = F[table] || [];
  const isSettings = table === 'settings';
  const seenTr = new Set();
  const html = `<div class="box"><h3>${row ? '編集' : '新規追加'} — ${esc((MENU.find(m=>m[0]===table)||['','',table])[2]||table)}</h3><div class="frm">
    ${fields.map(f => {
      const val = row ? (row[f.k] ?? '') : (f.type==='bool' ? 1 : (f.k==='status' ? (table==='reviews'?'pending':'published') : ''));
      let inp = '';
      if (f.type === 'textarea') inp = `<textarea data-k="${f.k}" rows="4">${esc(val)}</textarea>`;
      else if (f.type === 'number') inp = `<input data-k="${f.k}" type="number" value="${esc(val)}" ${isSettings&&row&&f.k==='key'?'disabled':''}>`;
      else if (f.type === 'bool') inp = `<select data-k="${f.k}" data-num="1">${Object.entries(BOOL_OPTS).map(([v,l])=>`<option value="${v}" ${String(val)===v?'selected':''}>${l}</option>`).join('')}</select>`;
      else if (f.type === 'select') inp = `<select data-k="${f.k}">${Object.entries(f.opts).map(([v,l])=>`<option value="${v}" ${String(val)===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
      else if (f.type === 'area') inp = `<select data-k="${f.k}" data-num="1"><option value="">— 選択 —</option>${AREAS.map(a=>`<option value="${a.id}" ${row&&row[f.k]===a.id?'selected':''}>${esc(a.name_ja)}</option>`).join('')}</select>`;
      else if (f.type === 'store') inp = `<select data-k="${f.k}" data-num="1"><option value="">— 選択 —</option>${STORES.map(s=>`<option value="${s.id}" ${row&&row[f.k]===s.id?'selected':''}>#${s.id} ${esc(s.name_ja)}</option>`).join('')}</select>`;
      else if (f.type === 'paychecks') { const cur = String(val||'').split(',').map(x=>x.trim()).filter(Boolean);
        inp = `<div class="cbg" data-k="${f.k}" data-cbg="1">${PAY_OPTS.map(p=>`<label><input type="checkbox" value="${p}" ${cur.includes(p)?'checked':''}>${p}</label>`).join('')}</div>`; }
      else if (f.type === 'image') inp = `<div class="upzone">
        <img id="pv-${f.k}" src="${esc(val)||''}" style="${val?'':'display:none'}" onerror="this.style.display='none'">
        <input data-k="${f.k}" type="hidden" value="${esc(val)}">
        <label class="uplabel">⇪ ファイルを選択<input type="file" accept="image/*" onchange="uploadImg(this,'${f.k}')"></label>
        <div class="help" id="upmsg-${f.k}">アップロードすると自動でURLが設定されます</div></div>`;
      else inp = `<input data-k="${f.k}" type="text" value="${esc(val)}" ${isSettings&&row&&f.k==='key'?'disabled':''}>`;
      let bar = '';
      if (f.tr && !seenTr.has(f.tr)) { seenTr.add(f.tr); bar = `<div class="trbar"><button type="button" class="btn tr sm" onclick="autoTr('${f.tr}')">⇄ 日本語 → 英語・中文 に自動翻訳</button><span>${esc(f.tr)}_* の英語・中文欄へ自動入力します（後から修正できます）</span></div>`; }
      return bar + `<div class="${f.type==='textarea'||f.type==='image'||f.type==='paychecks'?'full':''}"><label>${esc(f.l)}</label>${inp}${f.help?`<div class="help">${esc(f.help)}</div>`:''}</div>`;
    }).join('')}</div>
    <div style="margin-top:18px;display:flex;gap:8px">
      <button class="btn" onclick="saveRow('${table}', ${row ? (isSettings ? `'${esc(row.key)}'` : row.id) : 'null'}, this)">保存する</button>
      <button class="btn ghost" onclick="this.closest('.modal').remove()">キャンセル</button></div></div>`;
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = html;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
}
async function uploadImg(input, key){
  const file = input.files && input.files[0]; if (!file) return;
  if (file.size > 5*1024*1024) return toast('画像は5MB以下にしてください');
  const msg = document.getElementById('upmsg-' + key); msg.textContent = 'アップロード中...';
  const reader = new FileReader();
  reader.onload = async () => {
    const r = await API('/api/upload', { method:'POST', body: JSON.stringify({ filename: file.name, data: reader.result }) });
    if (r.error) { msg.textContent = r.error; return toast(r.error); }
    document.querySelector(`[data-k="${key}"]`).value = r.url;
    const pv = document.getElementById('pv-' + key); pv.src = r.url; pv.style.display = '';
    msg.textContent = r.storage === 'cloudinary' ? 'Cloudinaryに保存しました（永続）' : '保存しました（ローカル保存: 本番はCloudinaryを設定してください）';
    toast('画像をアップロードしました');
  };
  reader.readAsDataURL(file);
}
async function autoTr(group){
  const ja = document.querySelector(`[data-k="${group}_ja"]`);
  if (!ja || !ja.value.trim()) return toast('先に日本語を入力してください');
  for (const to of ['en','zh']) {
    const r = await API('/api/translate', { method:'POST', body: JSON.stringify({ text: ja.value, from:'ja', to }) });
    const el = document.querySelector(`[data-k="${group}_${to}"]`);
    if (el && r.translated) el.value = r.translated;
  }
  toast('自動翻訳しました（内容を確認・修正してから保存してください）');
}
async function saveRow(table, id, btn){
  const data = {};
  btn.closest('.box').querySelectorAll('[data-k]').forEach(el => {
    if (el.dataset.cbg) { data[el.dataset.k] = [...el.querySelectorAll('input:checked')].map(c=>c.value).join(', '); return; }
    if (el.type === 'hidden' || el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')
      data[el.dataset.k] = (el.dataset.num || el.type === 'number') ? (parseInt(el.value, 10) || 0) : el.value;
  });
  const r = await API(id == null ? '/api/admin/' + table : `/api/admin/${table}/${id}`,
    { method: id == null ? 'POST' : 'PUT', body: JSON.stringify(data) });
  if (r.error) return toast(r.error);
  btn.closest('.modal').remove(); toast('保存しました'); render();
}
async function delRow(table, id){
  if (!confirm('本当に削除しますか? この操作は元に戻せません。')) return;
  await API(`/api/admin/${table}/${id}`, { method:'DELETE' }); toast('削除しました'); render();
}

/* DM管理 */
async function renderMessages(main){
  const rows = await API('/api/admin/messages');
  main.innerHTML = `<div class="top"><h2>✉ DM管理</h2></div>
  <div style="overflow:auto"><table><tr><th>ID</th><th>方向</th><th>店舗</th><th>ユーザー</th><th>原文</th><th>日本語</th><th>English</th><th>中文</th><th>日時</th><th>操作</th></tr>
  ${rows.map(m=>`<tr><td>${m.id}</td><td>${m.direction==='user_to_store'?'客→店':'店→客'}</td><td>${esc((STORES.find(s=>s.id===m.store_id)||{}).name_ja||m.store_id)}</td><td>${m.user_id}</td>
    <td>${esc(short(m.body))}</td><td>${esc(short(m.body_ja))}</td><td>${esc(short(m.body_en))}</td><td>${esc(short(m.body_zh))}</td>
    <td>${esc((m.created_at||'').slice(0,16))}</td>
    <td><button class="btn ghost sm" onclick="replyMsg(${m.id})">返信</button></td></tr>`).join('')||'<tr><td colspan="10" style="text-align:center;color:var(--sub)">メッセージはまだありません</td></tr>'}</table></div>`;
}
function replyMsg(id){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><h3>返信（日本語で入力 → 自動で3言語に翻訳されます）</h3>
    <div class="frm"><div class="full"><textarea id="rp" rows="4" placeholder="ご来店ありがとうございます。今夜お待ちしています。"></textarea></div></div>
    <div style="margin-top:14px;display:flex;gap:8px">
    <button class="btn" onclick="doReply(${id},this)">送信</button>
    <button class="btn ghost" onclick="this.closest('.modal').remove()">閉じる</button></div></div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
}
async function doReply(id, btn){
  const body = document.getElementById('rp').value.trim(); if (!body) return;
  await API(`/api/admin/messages/${id}/reply`, { method:'POST', body: JSON.stringify({ body, lang: 'ja' }) });
  btn.closest('.modal').remove(); toast('返信しました'); render();
}
render();
</script>
