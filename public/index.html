<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Tokyo Nightlife Guide</title>
<meta name="description" content="Discover the best clubs & nightlife in Tokyo. English & Chinese support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a227;--gold2:#e0c069;--bg:#0b0b0c;--bg2:#141416;--bg3:#1e1e21;--line:#2b2b2f;
  --txt:#efece4;--sub:#9a968c;
  --serif:'Cormorant Garamond','Noto Sans JP','Noto Sans SC',serif;
  --sans:'Noto Sans JP','Noto Sans SC','Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html[lang="zh"] body{--sans:'Noto Sans SC','Noto Sans JP','Helvetica Neue',Arial,sans-serif}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.75;letter-spacing:.02em;padding-bottom:76px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%}
h1,h2,h3{line-height:1.35}
.ic{display:inline-block;vertical-align:-3px;flex:none}
.notranslate{translate:no}
.hdr{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.14em;cursor:pointer;color:var(--txt)}
.logo span{color:var(--gold)}
.langs{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--line);border-radius:24px;padding:3px}
.langs button{background:none;border:0;color:var(--sub);padding:7px 13px;border-radius:18px;font-size:12px;font-weight:500;letter-spacing:.05em;cursor:pointer;font-family:var(--sans);min-height:34px;-webkit-appearance:none;appearance:none}
.langs button.on{background:var(--gold);color:#111;font-weight:700}
.hero{position:relative;padding:76px 22px 52px;text-align:center;background:linear-gradient(180deg,#171410,#0b0b0c)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,162,39,.16),transparent 62%)}
.hero h1{position:relative;font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:.06em;color:#f3ead2}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{position:relative;color:var(--sub);margin-top:14px;font-size:13px;letter-spacing:.08em}
.hero .rule{position:relative;width:56px;height:1px;background:var(--gold);margin:20px auto 0;opacity:.7}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.searchbox{position:relative;margin:-26px auto 0;max-width:660px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 34px rgba(0,0,0,.55)}
.searchbox input[type=text]{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:13px 15px;font-size:15px;font-family:var(--sans)}
.searchbox input:focus,.filters select:focus{outline:1px solid var(--gold)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filters select{flex:1;min-width:110px;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:13px;font-family:var(--sans);min-height:42px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);color:var(--sub);border-radius:22px;padding:9px 14px;font-size:12px;cursor:pointer;min-height:38px}
.chip.on{border-color:var(--gold);color:var(--gold2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(120deg,#d4af37,#b08d1e);color:#141414;font-weight:700;border:0;border-radius:10px;padding:13px 22px;font-size:14px;letter-spacing:.06em;cursor:pointer;text-align:center;font-family:var(--sans);-webkit-appearance:none}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.sm{padding:9px 15px;font-size:12px;min-height:40px}
.sec{margin:42px 0}
.sec h2{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.08em}
.sec h2 em{color:var(--gold);font-style:normal;margin-right:8px}
.sec .more{color:var(--sub);font-size:12px;float:right;margin-top:10px;cursor:pointer;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:10px}.hero h1{font-size:29px}}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.ph{height:158px;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px;font-weight:600;color:rgba(255,255,255,.88);background-size:cover;background-position:center}
.ph .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.62);border:1px solid var(--gold);color:var(--gold2);font-size:10px;font-family:var(--sans);padding:3px 9px;border-radius:12px;letter-spacing:.08em}
.card .bd{padding:13px 14px 14px}
.card h3{font-size:15px;font-weight:700;letter-spacing:.03em}
.meta{color:var(--sub);font-size:11.5px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{color:var(--gold);font-size:12px;letter-spacing:2.5px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);border-radius:6px;padding:3px 8px;font-size:10.5px;color:var(--sub);margin:3px 3px 0 0;letter-spacing:.03em}
.tag.g{color:var(--gold2);border:1px solid #3a3220;background:rgba(201,162,39,.07)}
.row{display:flex;gap:8px;margin-top:11px}
.row .btn{flex:1}
.detail-hero{min-height:230px;display:flex;align-items:flex-end;padding:20px;position:relative;background-size:cover;background-position:center}
.detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(11,11,12,.9))}
.detail-hero>div{position:relative;z-index:1}
.detail-hero h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.05em}
/* ---- center-mode carousel ---- */
.car{position:relative;margin-top:14px;user-select:none}
.car-view{overflow:hidden;padding:6px 0}
.car-track{display:flex;gap:10px;transition:transform .45s cubic-bezier(.22,.8,.3,1);will-change:transform}
.car-slide{flex:none;width:64%;border-radius:14px;overflow:hidden;position:relative;background:var(--bg3);border:1px solid var(--line);transform:scale(.86);opacity:.5;transition:transform .45s cubic-bezier(.22,.8,.3,1),opacity .45s,border-color .3s;cursor:pointer}
.car-slide.on{transform:scale(1);opacity:1;border-color:var(--gold);cursor:default}
.car-slide .im{height:300px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:52px;font-weight:600;color:rgba(255,255,255,.85)}
.car-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;border-radius:50%;background:rgba(10,10,12,.72);border:1px solid var(--line);color:var(--gold2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,background .2s;-webkit-appearance:none}
.car-arrow:hover{border-color:var(--gold);background:rgba(201,162,39,.15)}
.car-arrow.l{left:8px}.car-arrow.r{right:8px}
.car-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.car-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;transition:background .2s,width .2s}
.car-dots i.on{background:var(--gold);width:16px;border-radius:3px}
@media(min-width:720px){.car-slide{width:44%}.car-slide .im{height:340px}}
@media(max-width:640px){.car-slide{width:74%}.car-slide .im{height:250px}}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:18px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:0;color:var(--sub);padding:12px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-family:var(--sans);letter-spacing:.03em;min-height:44px;-webkit-appearance:none}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.panel{padding:18px 0;font-size:14px;line-height:1.9;color:#d9d4c7}
.kv{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--sub)}
.review{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}
.review .h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.review .who{font-size:11.5px;color:var(--sub)}
.fixed-cta{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(12,12,13,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.fixed-cta .btn{flex:1;padding:13px 8px;font-size:13px}
.footer-nav{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;background:#0e0e10;border-top:1px solid var(--line)}
.footer-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 calc(9px + env(safe-area-inset-bottom));font-size:9.5px;letter-spacing:.05em;color:var(--sub)}
.footer-nav a.on{color:var(--gold)}
.backlink{display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:24px;padding:10px 18px;font-size:13px;cursor:pointer;margin:14px 0 0;min-height:44px;font-family:var(--sans);-webkit-appearance:none}
.backlink:hover{border-color:var(--gold);color:var(--gold2)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:430px;max-height:85vh;overflow:auto}
.modal h3{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:14px;letter-spacing:.05em}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;color:var(--sub);margin-bottom:5px;letter-spacing:.05em}
.field input,.field textarea,.field select{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:11px;font-size:14px;font-family:var(--sans);min-height:42px}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--gold);color:#141414;padding:11px 24px;border-radius:26px;font-size:13px;font-weight:700;z-index:200;letter-spacing:.04em}
.msg-bubble{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:9px 0;font-size:13px}
.msg-bubble .tr{color:var(--sub);font-size:11px;border-top:1px dashed var(--line);margin-top:7px;padding-top:7px}
.big-rating{font-family:var(--serif);font-size:46px;font-weight:600;color:var(--gold)}
.empty{color:var(--sub);text-align:center;padding:34px;font-size:13px}
.sns-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.map-frame{width:100%;height:240px;border:0;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
.flt-group{margin-top:10px}
.flt-title{font-size:11px;color:var(--sub);letter-spacing:.08em;margin-bottom:6px}
.flt-chips{display:flex;gap:6px;flex-wrap:wrap}
.flt-chips .chip{padding:7px 12px;min-height:34px;font-size:11.5px}
.more-toggle{margin-top:12px;width:100%;background:none;border:1px dashed var(--line);color:var(--sub);border-radius:10px;padding:11px;font-size:12.5px;cursor:pointer;letter-spacing:.05em}
.more-toggle:hover{border-color:var(--gold);color:var(--gold2)}
footer{border-top:1px solid var(--line);margin-top:56px;padding:34px 16px;color:var(--sub);font-size:11.5px;text-align:center;letter-spacing:.08em}
footer .logo{font-size:15px}
</style>
</head>

let CAR_N = 0;
function carousel(items, hue){ /* items: [{url,label}] */
  if (!items.length) items = [{ url: null, label: '◆' }];
  const id = 'car' + (++CAR_N);
  const slides = items.concat(items.length === 1 ? [] : []);
  return `<div class="car" id="${id}">
    <div class="car-view"><div class="car-track" id="${id}-t">
      ${slides.map((s, i) => `<div class="car-slide${i===0?' on':''}" data-i="${i}" onclick="carGo('${id}',${i})"><div class="im" style="${s.url?`background-image:url('${esc(s.url)}')`:`background:${grad(hue)}`}">${s.url?'':esc(s.label||'◆')}</div></div>`).join('')}
    </div></div>
    ${slides.length>1?`<button type="button" class="car-arrow l" onclick="carMove('${id}',-1)">${ic('chevL',18)}</button>
    <button type="button" class="car-arrow r" onclick="carMove('${id}',1)">${ic('chevR',18)}</button>
    <div class="car-dots" id="${id}-d">${slides.map((s,i)=>`<i class="${i===0?'on':''}" onclick="carGo('${id}',${i})"></i>`).join('')}</div>`:''}
  </div>`;
}
function carState(id){ const el = document.getElementById(id); return el ? (el._s = el._s || { i: 0 }) : { i: 0 }; }
function carInit(id, n){
  const el = document.getElementById(id); if (!el) return;
  el._n = n; carLayout(id);
  let sx = 0, dx = 0, drag = false;
  const view = el.querySelector('.car-view');
  view.addEventListener('touchstart', e => { sx = e.touches[0].clientX; drag = true; }, { passive: true });
  view.addEventListener('touchmove', e => { if (drag) dx = e.touches[0].clientX - sx; }, { passive: true });
  view.addEventListener('touchend', () => { if (!drag) return; if (dx < -40) carMove(id, 1); else if (dx > 40) carMove(id, -1); dx = 0; drag = false; });
  window.addEventListener('resize', () => carLayout(id));
}
function carLayout(id){
  const el = document.getElementById(id); if (!el) return;
  const track = document.getElementById(id + '-t'); if (!track) return;
  const slides = track.children; const st = carState(id);
  const view = el.querySelector('.car-view');
  const sw = slides[0] ? slides[0].offsetWidth + 10 : 0;
  track.style.transform = `translateX(${view.offsetWidth/2 - sw/2 - st.i*sw}px)`;
  [...slides].forEach((s, i) => s.classList.toggle('on', i === st.i));
  const dots = document.getElementById(id + '-d');
  if (dots) [...dots.children].forEach((d, i) => d.classList.toggle('on', i === st.i));
}
function carGo(id, i){ const el = document.getElementById(id); if (!el) return; const st = carState(id); st.i = Math.max(0, Math.min((el._n||1)-1, i)); carLayout(id); }
function carMove(id, d){ const el = document.getElementById(id); if (!el) return; carGo(id, carState(id).i + d); }

    const mp = /maps\/place\/([^/?]+)/.exec(s.google_map_url);
    const query = mq ? mq[1] : (mp ? mp[1] : null);
    openUrl = query ? ('https://www.google.com/maps/search/?api=1&query=' + query) : s.google_map_url;
    if (!embedQ && query) embedQ = query;
  }
  if (!openUrl && s.address) openUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address);

function castHeight(range, el){
  el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));

  else { CAST_F._hr = range; CAST_F.height_min = lo; CAST_F.height_max = hi; el.classList.add('on'); }
  renderCastList();
}

function sendMsg(storeId, castId, btn){
  const body = document.getElementById('msgbody').value.trim(); if (!body) return;
  API('/api/messages', { method:'POST', body: JSON.stringify({ store_id: storeId, cast_id: castId, body }) })
    .then(() => { btn.closest('.modal').remove(); toast(t('msg_sent')); });
}
/* 口コミ: 店舗選択ピッカー → 投稿モーダル (店舗/キャスト両対応) */
async function reviewPicker(){
  const stores = await API('/api/stores');
  modal(`<h3>${ic('pen',16)} ${t('write_review')}</h3>
    <div class="field"><label>${t('select_store')}</label>
    <select id="rp-s">${stores.map(s=>`<option value="${s.id}">${esc(L(s,'name'))}</option>`).join('')}</select></div>
    <button type="button" class="btn" style="width:100%" onclick="reviewModal(+document.getElementById('rp-s').value,null,document.getElementById('rp-s').selectedOptions[0].textContent)">${t('write_review')} →</button>`);
}
function reviewModal(storeId, castId, targetName){
  document.querySelectorAll('.modal').forEach(m => m.remove());
  modal(`<h3>${ic('pen',16)} ${castId ? t('rv_cast') : t('rv_store')}</h3>
    <div style="font-size:12px;color:var(--gold2);margin-bottom:10px">${esc(targetName||'')}</div>
    <div class="field"><label>★</label><select id="rv-r">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Name</label><input id="rv-n" value="${esc(ME?ME.name:'')}"></div>
    <div class="field"><label>Title</label><input id="rv-t"></div>
    <div class="field"><label>Review</label><textarea id="rv-b" rows="4"></textarea></div>
    <button type="button" class="btn" style="width:100%" onclick="submitReview(${storeId},${castId||null},this)">${t('submit')}</button>`);
}
function submitReview(storeId, castId, btn){
  API('/api/reviews',{method:'POST',body:JSON.stringify({ store_id: storeId, cast_id: castId,
    rating:+document.getElementById('rv-r').value, author_name:document.getElementById('rv-n').value,
    title:document.getElementById('rv-t').value, body:document.getElementById('rv-b').value, language:LANG })})
  .then(()=>{ btn.closest('.modal').remove(); toast(t('review_saved')); });
}
function loginModal(){
  modal(`<h3>${t('login')} / ${t('register')}</h3>
  <div class="field"><label>Name (${t('register')})</label><input id="au-n"></div>
  <div class="field"><label>Email</label><input id="au-e" type="email"></div>
  <div class="field"><label>Password</label><input id="au-p" type="password"></div>
  <div class="row"><button type="button" class="btn" onclick="authDo('login')">${t('login')}</button><button type="button" class="btn ghost" onclick="authDo('register')">${t('register')}</button></div>`);
}
async function authDo(mode){
  const body = { email: document.getElementById('au-e').value, password: document.getElementById('au-p').value, name: document.getElementById('au-n').value, language: LANG };
  const r = await API('/api/auth/' + mode, { method:'POST', body: JSON.stringify(body) });
  if (r.error) return toast(r.error);
  TOKEN = r.token; localStorage.setItem('tng_token', TOKEN); ME = r.user;
  document.querySelector('.modal') && document.querySelector('.modal').remove();
  toast(ME.name || ME.email); render();
}

/* ================= router ================= */
async function render(){
  markLang();
  const app = document.getElementById('app');
  const p = PAGE;
  const pages = { home: pageHome, stores: pageStores, store: pageStore, casts: pageCasts, cast: pageCast,
    events: pageEvents, event: pageEvent, coupons: pageCoupons, reviews: pageReviews, blogs: pageBlogs, blog: pageBlog, mypage: pageMypage };
  app.innerHTML = await (pages[p.name] || pageHome)(p.arg);
  const nav = [['home','home',t('home')],['stores','search',t('find_club')],['casts','users',t('find_girl')],['events','calendar',t('events')],['coupons','ticket',t('coupons')],['mypage','user',t('mypage')]];
  document.getElementById('fnav').innerHTML = nav.map(n => `<a class="${p.name===n[0]?'on':''}" href="javascript:go('${n[0]}')">${ic(n[1],19)}<span>${n[2]}</span></a>`).join('');
  document.querySelectorAll('.car').forEach(el => { if (!el._init) { el._init = 1; carInit(el.id, el.querySelectorAll('.car-slide').length); } });
  if (p.name === 'casts') renderCastList();
}
function setSiteName(){
  const n = LANG === 'ja' ? (SETTINGS.site_name_ja || SETTINGS.site_name) : LANG === 'zh' ? (SETTINGS.site_name_zh || SETTINGS.site_name) : SETTINGS.site_name;
  if (n) { document.getElementById('sitename').textContent = n; document.getElementById('f_sitename').textContent = n; }
}
(async () => {
  SETTINGS = await API('/api/settings');
  document.documentElement.lang = LANG;
  setSiteName();
  render();
})();
</script>
