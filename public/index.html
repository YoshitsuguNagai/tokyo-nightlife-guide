<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tokyo Nightlife Guide</title>
<meta name="description" content="Discover the best clubs & nightlife in Tokyo. English & Chinese support.">
<style>
:root{--gold:#c9a227;--gold2:#e8c65a;--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--line:#2a2a2a;--txt:#f2ede0;--sub:#a39e90}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif;padding-bottom:70px}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.hdr{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:700;letter-spacing:1px;cursor:pointer}
.logo span{color:var(--gold)}
.langs{display:flex;gap:2px;background:var(--bg3);border-radius:20px;padding:3px}
.langs button{background:none;border:0;color:var(--sub);padding:4px 10px;border-radius:16px;font-size:12px;cursor:pointer}
.langs button.on{background:var(--gold);color:#000;font-weight:700}
.hero{position:relative;padding:60px 20px 40px;text-align:center;background:linear-gradient(180deg,#16130a,#0a0a0a)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,162,39,.18),transparent 60%)}
.hero h1{position:relative;font-size:32px;font-weight:800;letter-spacing:1px;background:linear-gradient(120deg,#f5e7b8,#c9a227);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{position:relative;color:var(--sub);margin-top:10px;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.searchbox{position:relative;margin:-24px auto 0;max-width:640px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.searchbox input[type=text]{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 14px;font-size:15px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filters select{flex:1;min-width:110px;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:13px}
.chip{background:var(--bg3);border:1px solid var(--line);color:var(--sub);border-radius:20px;padding:9px 13px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold2)}
.btn{display:inline-block;background:linear-gradient(120deg,var(--gold),#a8871d);color:#000;font-weight:700;border:0;border-radius:10px;padding:12px 20px;font-size:14px;cursor:pointer;text-align:center}
.btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:12px}
.sec{margin:36px 0}
.sec h2{font-size:20px;font-weight:700;margin-bottom:4px}
.sec h2 em{color:var(--gold);font-style:normal}
.sec .more{color:var(--sub);font-size:12px;float:right;margin-top:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.ph{height:150px;position:relative;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:rgba(255,255,255,.85)}
.ph .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);border:1px solid var(--gold);color:var(--gold2);font-size:10px;padding:3px 8px;border-radius:12px;font-weight:400}
.card .bd{padding:12px}
.card h3{font-size:15px;font-weight:700}
.meta{color:var(--sub);font-size:11px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.stars{color:var(--gold);font-size:12px;letter-spacing:2px}
.tag{display:inline-block;background:var(--bg3);border-radius:6px;padding:2px 7px;font-size:10px;color:var(--sub);margin:2px 2px 0 0}
.tag.g{color:var(--gold2);border:1px solid #3a3020}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.detail-hero{height:220px;display:flex;align-items:flex-end;padding:16px;position:relative}
.detail-hero h1{font-size:26px;text-shadow:0 2px 8px #000}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:16px}
.tabs button{background:none;border:0;color:var(--sub);padding:10px 14px;font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.panel{padding:16px 0;font-size:14px;line-height:1.8;color:#d8d2c4}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--sub)}
.review{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.review .h{display:flex;justify-content:space-between;align-items:center}
.review .who{font-size:12px;color:var(--sub)}
.fixed-cta{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(12,12,12,.95);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.fixed-cta .btn{flex:1;padding:13px 8px;font-size:13px}
.footer-nav{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;background:#0d0d0d;border-top:1px solid var(--line)}
.footer-nav a{flex:1;text-align:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom));font-size:10px;color:var(--sub)}
.footer-nav a.on{color:var(--gold)}
.footer-nav a i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:420px;max-height:85vh;overflow:auto}
.modal h3{margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px;font-size:14px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:700;z-index:200}
.msg-bubble{background:var(--bg3);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px}
.msg-bubble .tr{color:var(--sub);font-size:11px;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.big-rating{font-size:44px;font-weight:800;color:var(--gold)}
.empty{color:var(--sub);text-align:center;padding:30px;font-size:13px}
.backbtn{color:var(--sub);font-size:13px;cursor:pointer;display:inline-block;margin:14px 0 0}
footer{border-top:1px solid var(--line);margin-top:50px;padding:30px 16px;color:var(--sub);font-size:12px;text-align:center}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo" onclick="go('home')"><span>◆</span> <span id="sitename">Tokyo Nightlife Guide</span></div>
  <div class="langs">
    <button data-lang="ja" onclick="setLang('ja')">JP</button>
    <button data-lang="en" onclick="setLang('en')">EN</button>
    <button data-lang="zh" onclick="setLang('zh')">中文</button>
  </div>
</header>
<main id="app"></main>
<nav class="footer-nav" id="fnav"></nav>
<script>
/* ================= i18n ================= */
const I = {
 en:{find_club:'Find a Club',find_girl:'Find a Girl',reviews:'Reviews',events:'Events',coupons:'Coupons',blog:'Blog',home:'Home',
  hero1:'Discover Tokyo Nightlife',hero2:'Find the Best Clubs, Hostess Clubs & Nightlife Experiences in Tokyo',
  where:'Where do you want to go?',search:'Search',area:'Area',genre:'Genre',budget:'Budget',all:'All',
  rec_clubs:'Recommended Clubs',pop_girls:'Popular Girls',tonight:"Tonight's Events",sp_coupons:'Special Coupons',latest_rev:'Latest Reviews',guide:'Tokyo Nightlife Guide',

  rec_clubs:'おすすめ店舗',pop_girls:'人気キャスト',tonight:'今夜のイベント',sp_coupons:'スペシャルクーポン',latest_rev:'最新の口コミ',guide:'東京ナイトライフガイド',
  find_perfect:'最高の夜を見つけよう',view:'詳細を見る',contact:'問い合わせ',reserve:'予約する',message:'メッセージ',
  about:'店舗情報',girls:'キャスト',access:'アクセス',hours:'営業時間',closed:'定休日',price:'予算',charge:'チャージ',fee:'サービス料',pay:'支払い方法',langs_ok:'対応言語',
  eng_ok:'英語OK',zh_ok:'中国語OK',card_ok:'カード可',fw:'外国人歓迎',reserve_ok:'予約可',
  reviews_of:'口コミ',write_review:'口コミを書く',submit:'投稿する',login:'ログイン',register:'新規登録',mypage:'マイページ',logout:'ログアウト',
  favs:'お気に入り',my_coupons:'マイクーポン',messages:'メッセージ',get_coupon:'クーポンを取得',valid:'有効期限',code:'コード',

  review_saved:'ありがとうございます!承認後に掲載されます。',coupon_saved:'クーポンを保存しました!',msg_sent:'送信しました!',need_login:'ログインしてください',
  tonight_only:'今夜限定',this_week:'今週',read_more:'続きを読む',send:'送信',original:'原文',translated:'自動翻訳',
  height:'身長',hobbies:'趣味',favorites:'好きなもの',store:'店舗',belongs:'在籍店舗',cast:'キャスト',admin:'管理',share:'共有'},
 zh:{find_club:'查找店铺',find_girl:'查找公关',reviews:'评价',events:'活动',coupons:'优惠券',blog:'博客',home:'首页',
  hero1:'探索东京夜生活',hero2:'寻找东京最好的俱乐部、夜总会和夜生活体验',
  where:'您想去哪里?',search:'搜索',area:'区域',genre:'类型',budget:'预算',all:'全部',
  rec_clubs:'推荐店铺',pop_girls:'人气公关',tonight:'今晚活动',sp_coupons:'特别优惠券',latest_rev:'最新评价',guide:'东京夜生活指南',
  find_perfect:'找到您的完美之夜',view:'查看详情',contact:'咨询',reserve:'预约',message:'发消息',
  about:'店铺信息',girls:'公关',access:'交通',hours:'营业时间',closed:'休息日',price:'预算',charge:'台费',fee:'服务费',pay:'支付方式',langs_ok:'对应语言',
  eng_ok:'会英语',zh_ok:'会中文',card_ok:'可刷卡',fw:'欢迎外国客人',reserve_ok:'可预约',
  reviews_of:'评价',write_review:'写评价',submit:'提交',login:'登录',register:'注册',mypage:'我的页面',logout:'退出',
  favs:'收藏',my_coupons:'我的优惠券',messages:'消息',get_coupon:'领取优惠券',valid:'有效期至',code:'优惠码',
  visit_club:'前往该店',ask_club:'咨询店铺',line:'通过LINE咨询',map:'在Google地图打开',
  review_saved:'谢谢!评价经审核后公开。',coupon_saved:'优惠券已保存!',msg_sent:'已发送!',need_login:'请先登录',
  tonight_only:'今晚限定',this_week:'本周',read_more:'阅读更多',send:'发送',original:'原文',translated:'自动翻译',
  height:'身高',hobbies:'爱好',favorites:'喜欢的东西',store:'店铺',belongs:'所属店铺',cast:'公关',admin:'管理',share:'分享'}
};
let LANG = localStorage.tng_lang || 'en';
const t = k => (I[LANG] && I[LANG][k]) || I.en[k] || k;
const L = (o, f) => o[f + '_' + LANG] || o[f + '_en'] || o[f + '_ja'] || '';
function setLang(l){ LANG = l; localStorage.tng_lang = l; document.documentElement.lang = l === 'zh' ? 'zh' : l; render(); markLang(); }
function markLang(){ document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG)); }

/* ================= helpers ================= */
const API = (p, opt) => fetch(p, { ...opt, headers: { 'Content-Type':'application/json', ...(opt&&opt.headers), ...(TOKEN ? { Authorization:'Bearer '+TOKEN } : {}) } }).then(r => r.json());
let TOKEN = localStorage.tng_token || '';
let ME = null;
if (TOKEN) API('/api/me').then(u => { if (!u.error) ME = u; render(); });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grad = h => `linear-gradient(135deg, hsl(${h||45},45%,22%), hsl(${(h||45)+40},55%,12%))`;
const stars = n => '★★★★★'.slice(0, Math.round(n)) + '☆☆☆☆☆'.slice(0, 5 - Math.round(n));
function toast(msg){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2500); }
let PAGE = { name: 'home' };
function go(name, arg){ PAGE = { name, arg }; window.scrollTo(0, 0); render(); }
function modal(html){ const m = document.createElement('div'); m.className = 'modal'; m.onclick = e => { if (e.target === m) m.remove(); }; m.innerHTML = `<div class="box">${html}</div>`; document.body.appendChild(m); return m; }
function needLogin(){ if (ME) return false; toast(t('need_login')); loginModal(); return true; }

/* ================= components ================= */
function storeCard(s){
  return `<div class="card" onclick="go('store',${s.id})">
    <div class="ph" style="background:${grad(s.hue)}">${esc(L(s,'name'))[0]||''}${s.is_recommended?`<span class="badge">★ VIP</span>`:''}</div>
    <div class="bd"><h3>${esc(L(s,'name'))}</h3>
      <div class="stars">${stars(s.rating_avg)} <span style="color:var(--sub)">${s.rating_avg||'-'} (${s.review_count})</span></div>
      <div class="meta"><span>📍 ${s.area?esc(L(s.area,'name')):''}</span><span>🕐 ${esc(s.open_hours||'')}</span></div>
      <div class="meta"><span>💴 ¥${(s.budget_min||0).toLocaleString()}〜</span></div>
      <div>${s.english_ok?`<span class="tag g">${t('eng_ok')}</span>`:''}${s.chinese_ok?`<span class="tag g">${t('zh_ok')}</span>`:''}${s.foreigner_welcome?`<span class="tag g">${t('fw')}</span>`:''}${s.credit_card_ok?`<span class="tag">💳</span>`:''}</div>
      <div class="row"><button class="btn sm" onclick="event.stopPropagation();go('store',${s.id})">${t('view')}</button><button class="btn sm ghost" onclick="event.stopPropagation();contactStore(${s.id},'${esc(L(s,'name'))}')">${t('contact')}</button></div>
    </div></div>`;
}
function castCard(c){
  return `<div class="card" onclick="go('cast',${c.id})">
    <div class="ph" style="background:${grad(c.hue)}">${esc(c.display_name||c.name)[0]||''}${c.is_popular?`<span class="badge">♛ POPULAR</span>`:''}</div>
    <div class="bd"><h3>${esc(c.display_name||c.name)}</h3>
      <div class="meta"><span>🏠 ${esc(c['store_name_'+LANG]||c.store_name_en||'')}</span></div>
      <div>${c.english_ok?`<span class="tag g">${t('eng_ok')}</span>`:''}${c.chinese_ok?`<span class="tag g">${t('zh_ok')}</span>`:''}${c.height?`<span class="tag">${c.height}cm</span>`:''}</div>
      <div class="meta" style="margin-top:6px">${esc(L(c,'recommend'))}</div>
    </div></div>`;
}
function reviewCard(r){
  return `<div class="review"><div class="h"><span class="stars">${stars(r.rating)}</span><span class="who">${esc(r.author_name)} · ${esc((r.created_at||'').slice(0,10))}</span></div>
    ${r.title?`<div style="font-weight:700;margin-top:6px">${esc(r.title)}</div>`:''}
    <div style="color:#cfc9bb;margin-top:4px;font-size:13px">${esc(r.body)}</div>
    ${r.store_name_en?`<div class="meta" style="margin-top:6px">🏠 ${esc(r['store_name_'+LANG]||r.store_name_en)}</div>`:''}</div>`;
}
function eventCard(e){
  return `<div class="card" onclick="go('store',${e.store_id})"><div class="ph" style="height:110px;background:${grad(e.hue)}">🎉${e.event_date===new Date().toISOString().slice(0,10)?`<span class="badge">${t('tonight_only')}</span>`:''}</div>
    <div class="bd"><h3>${esc(L(e,'title'))}</h3><div class="meta"><span>🏠 ${esc(e['store_name_'+LANG]||e.store_name_en)}</span><span>📅 ${e.event_date} ${e.start_time||''}</span></div>
    <div class="meta">${esc(L(e,'desc'))}</div></div></div>`;
}
function couponCard(c){
  return `<div class="card"><div class="ph" style="height:110px;background:${grad(c.hue)}">🎫</div>
    <div class="bd"><h3>${esc(L(c,'title'))}</h3><div class="meta"><span>🏠 ${esc(c['store_name_'+LANG]||c.store_name_en)}</span><span>⏳ ${t('valid')}: ${c.valid_until||'-'}</span></div>
    <div class="meta">${esc(L(c,'desc'))}</div>
    <div class="row"><button class="btn sm" onclick="getCoupon(${c.id})">${t('get_coupon')}</button><button class="btn sm ghost" onclick="go('store',${c.store_id})">${t('view')}</button></div></div></div>`;
}

/* ================= pages ================= */
async function pageHome(){
  const [areas, stores, casts, events, coupons, reviews, blogs, summary] = await Promise.all([
    API('/api/areas'), API('/api/stores?recommended=1'), API('/api/casts?popular=1'),
    API('/api/events?when=week'), API('/api/coupons'), API('/api/reviews'), API('/api/blogs'), API('/api/reviews/summary')]);
  return `<section class="hero"><h1>${t('hero1')}</h1><p>${t('hero2')}</p></section>
  <div class="wrap"><div class="searchbox">
    <input type="text" id="sq" placeholder="${t('where')}" onkeydown="if(event.key==='Enter')doSearch()">
    <div class="filters">
      <select id="sa"><option value="">${t('area')}: ${t('all')}</option>${areas.map(a=>`<option value="${a.id}">${esc(L(a,'name'))}</option>`).join('')}</select>
      <select id="sg"><option value="">${t('genre')}: ${t('all')}</option><option value="luxury">Luxury</option><option value="lounge">Lounge</option><option value="members">Members</option><option value="casual">Casual</option></select>
      <select id="sb"><option value="">${t('budget')}: ${t('all')}</option><option value="20000">〜¥20,000</option><option value="50000">〜¥50,000</option><option value="100000">〜¥100,000</option></select>
      <button class="btn" onclick="doSearch()">${t('search')}</button>
    </div>
    <div class="filters"><span class="chip" onclick="this.classList.toggle('on')" id="ce">EN OK</span><span class="chip" onclick="this.classList.toggle('on')" id="cz">中文 OK</span><span class="chip" onclick="this.classList.toggle('on')" id="cf">${t('fw')}</span><span class="chip" onclick="this.classList.toggle('on')" id="cc">💳</span></div>
  </div>
  <section class="sec"><h2><em>◆</em> ${t('rec_clubs')}</h2><span class="more" onclick="go('stores')">${t('view')} →</span><div class="grid">${stores.slice(0,6).map(storeCard).join('')||`<div class="empty">-</div>`}</div></section>
  <section class="sec"><h2><em>◆</em> ${t('pop_girls')}</h2><span class="more" onclick="go('casts')">${t('view')} →</span><div class="grid">${casts.slice(0,6).map(castCard).join('')||`<div class="empty">-</div>`}</div></section>
  <section class="sec"><h2><em>◆</em> ${t('tonight')}</h2><span class="more" onclick="go('events')">${t('view')} →</span><div class="grid">${events.slice(0,4).map(eventCard).join('')||`<div class="empty">-</div>`}</div></section>
  <section class="sec"><h2><em>◆</em> ${t('sp_coupons')}</h2><span class="more" onclick="go('coupons')">${t('view')} →</span><div class="grid">${coupons.slice(0,4).map(couponCard).join('')||`<div class="empty">-</div>`}</div></section>
  <section class="sec"><h2><em>◆</em> ${t('latest_rev')}</h2><div style="display:flex;align-items:baseline;gap:12px;margin-top:8px"><span class="big-rating">${summary.avg}</span><span class="stars" style="font-size:20px">${stars(summary.avg)}</span><span style="color:var(--sub)">(${summary.cnt})</span></div>
    <div style="margin-top:10px">${reviews.slice(0,3).map(reviewCard).join('')||`<div class="empty">-</div>`}</div></section>
  <section class="sec"><h2><em>◆</em> ${t('guide')}</h2><div class="grid">${blogs.slice(0,3).map(b=>`<div class="card" onclick="go('blog','${b.slug}')"><div class="ph" style="height:110px;background:${grad(b.hue)}">📖</div><div class="bd"><span class="tag g">${esc(b.category||'')}</span><h3 style="margin-top:6px">${esc(L(b,'title'))}</h3><div class="meta">${esc(b.seo_description||'')}</div></div></div>`).join('')}</div></section>
  <section class="sec" style="text-align:center;padding:30px 0"><h2 style="font-size:24px">${t('find_perfect')}</h2><button class="btn" style="margin-top:14px;padding:14px 40px" onclick="go('stores')">${t('find_club')}</button></section>
  </div>`;
}
function doSearch(){
  const p = new URLSearchParams();
  const v = id => document.getElementById(id);
  if (v('sq') && v('sq').value) p.set('q', v('sq').value);
  if (v('sa') && v('sa').value) p.set('area', v('sa').value);
  if (v('sg') && v('sg').value) p.set('genre', v('sg').value);
  if (v('sb') && v('sb').value) p.set('budget', v('sb').value);
  if (v('ce') && v('ce').classList.contains('on')) p.set('lang', 'en');
  if (v('cz') && v('cz').classList.contains('on')) p.set('lang', 'zh');
  if (v('cf') && v('cf').classList.contains('on')) p.set('foreigner', '1');
  if (v('cc') && v('cc').classList.contains('on')) p.set('card', '1');
  go('stores', p.toString());
}
async function pageStores(qs){
  const [stores, areas] = await Promise.all([API('/api/stores?' + (qs || '')), API('/api/areas')]);
  return `<div class="wrap"><span class="backbtn" onclick="go('home')">← ${t('home')}</span>
  <section class="sec"><h2><em>◆</em> ${t('find_club')}</h2>
  <div class="filters" style="margin-top:12px">${areas.map(a=>`<span class="chip" onclick="go('stores','area=${a.id}')">${esc(L(a,'name'))}</span>`).join('')}
  <span class="chip" onclick="go('stores','lang=en')">EN OK</span><span class="chip" onclick="go('stores','lang=zh')">中文 OK</span><span class="chip" onclick="go('stores','sort=popular')">★ Popular</span></div>
  <div class="grid">${stores.map(storeCard).join('')||`<div class="empty">No results</div>`}</div></section></div>`;
}
async function pageStore(id){
  const s = await API('/api/stores/' + id);
  if (s.error) return `<div class="wrap"><div class="empty">Not found</div></div>`;
  window._store = s;
  return `<div class="detail-hero" style="background:${grad(s.hue)}"><div><h1>${esc(L(s,'name'))}</h1>
    <div class="stars" style="font-size:15px">${stars(s.rating_avg)} ${s.rating_avg} (${s.review_count} ${t('reviews_of')})</div></div></div>
  <div class="wrap">
  <div class="meta" style="margin-top:12px"><span>📍 ${s.area?esc(L(s.area,'name')):''}</span><span>🕐 ${esc(s.open_hours||'')}</span><span>💴 ¥${(s.budget_min||0).toLocaleString()}〜¥${(s.budget_max||0).toLocaleString()}</span></div>
  <div style="margin-top:8px">${s.english_ok?`<span class="tag g">${t('eng_ok')}</span>`:''}${s.chinese_ok?`<span class="tag g">${t('zh_ok')}</span>`:''}${s.foreigner_welcome?`<span class="tag g">${t('fw')}</span>`:''}${s.credit_card_ok?`<span class="tag">${t('card_ok')}</span>`:''}${s.reservation_ok?`<span class="tag">${t('reserve_ok')}</span>`:''}</div>
  <div class="tabs">
    <button class="on" onclick="tab(this,'about')">${t('about')}</button><button onclick="tab(this,'girls')">${t('girls')} (${s.casts.length})</button>
    <button onclick="tab(this,'reviews')">${t('reviews')} (${s.reviews.length})</button><button onclick="tab(this,'events')">${t('events')}</button>
    <button onclick="tab(this,'coupons')">${t('coupons')}</button><button onclick="tab(this,'access')">${t('access')}</button>
  </div>
  <div class="panel" id="p-about">
    <p>${esc(L(s,'desc'))}</p>
    <dl class="kv" style="margin-top:16px">
      <dt>${t('hours')}</dt><dd>${esc(s.open_hours||'-')}</dd><dt>${t('closed')}</dt><dd>${esc(s.closed_days||'-')}</dd>
      <dt>${t('price')}</dt><dd>¥${(s.budget_min||0).toLocaleString()}〜¥${(s.budget_max||0).toLocaleString()}</dd>
      <dt>${t('charge')}</dt><dd>${esc(s.charge||'-')}</dd><dt>${t('fee')}</dt><dd>${esc(s.service_fee||'-')}</dd>
      <dt>${t('pay')}</dt><dd>${esc(s.payment_methods||'-')}</dd><dt>${t('cast')}</dt><dd>${s.cast_count||s.casts.length}</dd>
    </dl></div>
  <div class="panel" id="p-girls" style="display:none"><div class="grid">${s.casts.map(castCard).join('')||`<div class="empty">-</div>`}</div></div>
  <div class="panel" id="p-reviews" style="display:none">
    <div style="display:flex;align-items:baseline;gap:10px"><span class="big-rating">${s.rating_avg||'-'}</span><span class="stars" style="font-size:18px">${stars(s.rating_avg)}</span></div>
    <button class="btn sm ghost" style="margin-top:10px" onclick="reviewModal(${s.id})">✍️ ${t('write_review')}</button>
    ${s.reviews.map(reviewCard).join('')||`<div class="empty">-</div>`}</div>
  <div class="panel" id="p-events" style="display:none"><div class="grid">${s.events.map(eventCard).join('')||`<div class="empty">-</div>`}</div></div>
  <div class="panel" id="p-coupons" style="display:none"><div class="grid">${s.coupons.map(couponCard).join('')||`<div class="empty">-</div>`}</div></div>
  <div class="panel" id="p-access" style="display:none"><p>${esc(s.address||'')}</p>
    ${s.google_map_url?`<a class="btn sm ghost" style="margin-top:10px" href="${esc(s.google_map_url)}" target="_blank">🗺 ${t('map')}</a>`:''}</div>
  </div>
  <div class="fixed-cta">
    ${s.line_url?`<a class="btn ghost" href="${esc(s.line_url)}" target="_blank">💬 LINE</a>`:''}
    <button class="btn ghost" onclick="fav('store',${s.id})">♡</button>
    <button class="btn" onclick="contactStore(${s.id},'${esc(L(s,'name'))}')">${t('message')}</button>
    ${s.reservation_ok?`<button class="btn" onclick="contactStore(${s.id},'${esc(L(s,'name'))}')">${t('reserve')}</button>`:''}
  </div>`;
}
function tab(btn, name){
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on')); btn.classList.add('on');
  document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
  document.getElementById('p-' + name).style.display = 'block';
}
async function pageCast(id){
  const c = await API('/api/casts/' + id);
  if (c.error) return `<div class="wrap"><div class="empty">Not found</div></div>`;
  return `<div class="detail-hero" style="background:${grad(c.hue)};align-items:center;justify-content:center;font-size:60px;font-weight:800">${esc(c.display_name||c.name)[0]}</div>
  <div class="wrap"><section class="sec">
  <h2 style="font-size:24px">${esc(c.display_name||c.name)} <span style="font-size:13px;color:var(--sub)">${esc(c.name||'')}</span></h2>
  <div class="meta"><span>🏠 <a style="color:var(--gold)" href="javascript:go('store',${c.store_id})">${esc(c['store_name_'+LANG]||c.store_name_en)}</a></span></div>
  <div style="margin-top:8px">${c.english_ok?`<span class="tag g">${t('eng_ok')}</span>`:''}${c.chinese_ok?`<span class="tag g">${t('zh_ok')}</span>`:''}${(c.languages||'').split(',').map(l=>`<span class="tag">${l.toUpperCase()}</span>`).join('')}</div>
  <div class="panel">
    <div style="background:var(--bg2);border-left:3px solid var(--gold);padding:12px;border-radius:0 10px 10px 0;margin-bottom:14px">💛 ${esc(L(c,'recommend'))}</div>

    <dl class="kv" style="margin-top:14px"><dt>${t('height')}</dt><dd>${c.height?c.height+' cm':'-'}</dd><dt>${t('hobbies')}</dt><dd>${esc(c.hobbies||'-')}</dd><dt>${t('favorites')}</dt><dd>${esc(c['favorites']||'-')}</dd></dl>
    ${c.sns_instagram?`<a class="btn sm ghost" style="margin-top:12px" href="${esc(c.sns_instagram)}" target="_blank">📷 Instagram</a>`:''}
  </div></section></div>
  <div class="fixed-cta"><button class="btn ghost" onclick="fav('cast',${c.id})">♡</button>
  <button class="btn" onclick="contactStore(${c.store_id},'${esc(c['store_name_'+LANG]||c.store_name_en)}',${c.id})">${t('message')}</button>
  <button class="btn ghost" onclick="go('store',${c.store_id})">${t('visit_club')}</button></div>`;
}
async function pageCasts(){ const cs = await API('/api/casts'); return `<div class="wrap"><span class="backbtn" onclick="go('home')">← ${t('home')}</span><section class="sec"><h2><em>◆</em> ${t('find_girl')}</h2><div class="grid">${cs.map(castCard).join('')||`<div class="empty">-</div>`}</div></section></div>`; }
async function pageEvents(){ const [a, b] = await Promise.all([API('/api/events?when=today'), API('/api/events?when=week')]); return `<div class="wrap"><span class="backbtn" onclick="go('home')">← ${t('home')}</span><section class="sec"><h2><em>◆</em> ${t('tonight')}</h2><div class="grid">${a.map(eventCard).join('')||`<div class="empty">-</div>`}</div></section><section class="sec"><h2><em>◆</em> ${t('this_week')}</h2><div class="grid">${b.map(eventCard).join('')||`<div class="empty">-</div>`}</div></section></div>`; }
async function pageCoupons(){ const cs = await API('/api/coupons'); return `<div class="wrap"><span class="backbtn" onclick="go('home')">← ${t('home')}</span><section class="sec"><h2><em>◆</em> ${t('sp_coupons')}</h2><div class="grid">${cs.map(couponCard).join('')||`<div class="empty">-</div>`}</div></section></div>`; }
async function pageReviews(){ const rs = await API('/api/reviews'); const s = await API('/api/reviews/summary'); return `<div class="wrap"><span class="backbtn" onclick="go('home')">← ${t('home')}</span><section class="sec"><h2><em>◆</em> ${t('reviews')}</h2><div style="display:flex;align-items:baseline;gap:12px;margin-top:8px"><span class="big-rating">${s.avg}</span><span class="stars" style="font-size:20px">${stars(s.avg)}</span></div><div style="margin-top:12px">${rs.map(reviewCard).join('')||`<div class="empty">-</div>`}</div></section></div>`; }
async function pageBlogs(){ const bs = await API('/api/blogs'); return `<div class="wrap"><span class="backbtn" onclick="go('home')">← ${t('home')}</span><section class="sec"><h2><em>◆</em> ${t('blog')}</h2><div class="grid">${bs.map(b=>`<div class="card" onclick="go('blog','${b.slug}')"><div class="ph" style="height:110px;background:${grad(b.hue)}">📖</div><div class="bd"><span class="tag g">${esc(b.category||'')}</span><h3 style="margin-top:6px">${esc(L(b,'title'))}</h3><div class="meta">${esc(b.seo_description||'')}</div></div></div>`).join('')}</div></section></div>`; }
async function pageBlog(slug){
  const b = await API('/api/blogs/' + slug);
  if (b.error) return `<div class="wrap"><div class="empty">Not found</div></div>`;
  return `<div class="wrap"><span class="backbtn" onclick="go('blogs')">← ${t('blog')}</span><section class="sec">
  <span class="tag g">${esc(b.category||'')}</span><h2 style="font-size:24px;margin-top:8px">${esc(L(b,'title'))}</h2>
  <div class="panel">${esc(L(b,'body')).split('\n').map(p => p.trim() ? `<p style="margin-bottom:12px">${p}</p>` : '').join('')}</div>
  <div style="text-align:center;margin:26px 0"><button class="btn" onclick="go('stores')">${t('find_club')}</button> <button class="btn ghost" onclick="go('coupons')">${t('get_coupon')}</button></div></section></div>`;
}
async function pageMypage(){
  if (!ME) { loginModal(); return `<div class="wrap"><div class="empty">-</div></div>`; }
  const u = await API('/api/me');
  const favStores = u.favorites.filter(f => f.target_type === 'store');
  const favCasts = u.favorites.filter(f => f.target_type === 'cast');
  const msgs = u.messages;
  return `<div class="wrap"><section class="sec"><h2><em>◆</em> ${t('mypage')}</h2>
  <div class="meta" style="margin:8px 0">👤 ${esc(u.name||'')} · ${esc(u.email)} ${u.role==='admin'?`· <a href="/admin.html" style="color:var(--gold)">⚙ ${t('admin')}</a>`:''}</div>
  <button class="btn sm ghost" onclick="localStorage.removeItem('tng_token');TOKEN='';ME=null;go('home')">${t('logout')}</button>
  <h2 style="margin-top:26px"><em>◆</em> ${t('my_coupons')}</h2><div class="grid">${u.coupons.map(c=>`<div class="card"><div class="bd"><h3>${esc(L(c,'title'))}</h3><div class="meta">${t('code')}: <b style="color:var(--gold)">${esc(c.code||'')}</b> · ${t('valid')}: ${c.valid_until||'-'}</div></div></div>`).join('')||`<div class="empty">-</div>`}</div>
  <h2 style="margin-top:26px"><em>◆</em> ${t('favs')}</h2><div class="meta">${favStores.map(f=>`<span class="chip" onclick="go('store',${f.target_id})">🏠 #${f.target_id}</span>`).join(' ')} ${favCasts.map(f=>`<span class="chip" onclick="go('cast',${f.target_id})">👤 #${f.target_id}</span>`).join(' ')||''}</div>
  <h2 style="margin-top:26px"><em>◆</em> ${t('messages')}</h2>
  ${msgs.map(m=>`<div class="msg-bubble"><div class="who" style="font-size:11px;color:var(--sub)">${m.direction==='user_to_store'?'→':'←'} ${esc((m.created_at||'').slice(0,16))}</div>
    <div>${esc(m['body_'+LANG]||m.body)}</div><div class="tr">${t('original')}: ${esc(m.body)}</div></div>`).join('')||`<div class="empty">-</div>`}
  </section></div>`;
}

/* ================= actions ================= */
function fav(type, id){ if (needLogin()) return; API('/api/favorites', { method:'POST', body: JSON.stringify({ target_type: type, target_id: id }) }).then(r => toast(r.favorited ? '♥' : '♡')); }
function getCoupon(id){ if (needLogin()) return; API(`/api/coupons/${id}/get`, { method:'POST' }).then(() => toast(t('coupon_saved'))); }
function contactStore(storeId, name, castId){
  if (needLogin()) return;
  const m = modal(`<h3>💬 ${esc(name)}</h3>
    <div class="field"><label>${t('message')} (${LANG.toUpperCase()})</label><textarea id="msgbody" rows="4" placeholder="Hello! I'd like to visit tonight."></textarea></div>
    <button class="btn" style="width:100%" onclick="sendMsg(${storeId},${castId||null},this)">${t('send')}</button>
    <p style="font-size:11px;color:var(--sub);margin-top:10px">${t('translated')}: JA / EN / 中文</p>`);
  m.querySelector('textarea').focus();
}
function sendMsg(storeId, castId, btn){
  const body = document.getElementById('msgbody').value.trim(); if (!body) return;
  API('/api/messages', { method:'POST', body: JSON.stringify({ store_id: storeId, cast_id: castId, body }) })
    .then(() => { btn.closest('.modal').remove(); toast(t('msg_sent')); });
}
function reviewModal(storeId){
  const m = modal(`<h3>✍️ ${t('write_review')}</h3>
    <div class="field"><label>★</label><select id="rv-r">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Name</label><input id="rv-n" value="${esc(ME?ME.name:'')}"></div>
    <div class="field"><label>Title</label><input id="rv-t"></div>
    <div class="field"><label>Review</label><textarea id="rv-b" rows="4"></textarea></div>
    <button class="btn" style="width:100%" onclick="API('/api/reviews',{method:'POST',body:JSON.stringify({store_id:${storeId},rating:+document.getElementById('rv-r').value,author_name:document.getElementById('rv-n').value,title:document.getElementById('rv-t').value,body:document.getElementById('rv-b').value,language:LANG})}).then(()=>{this.closest('.modal').remove();toast(t('review_saved'))})">${t('submit')}</button>`);
}
function loginModal(){
  modal(`<h3>🔑 ${t('login')} / ${t('register')}</h3>
  <div class="field"><label>Name (${t('register')})</label><input id="au-n"></div>
  <div class="field"><label>Email</label><input id="au-e" type="email"></div>
  <div class="field"><label>Password</label><input id="au-p" type="password"></div>
  <div class="row"><button class="btn" onclick="authDo('login')">${t('login')}</button><button class="btn ghost" onclick="authDo('register')">${t('register')}</button></div>`);
}
async function authDo(mode){
  const body = { email: document.getElementById('au-e').value, password: document.getElementById('au-p').value, name: document.getElementById('au-n').value, language: LANG };
  const r = await API('/api/auth/' + mode, { method:'POST', body: JSON.stringify(body) });
  if (r.error) return toast(r.error);
  TOKEN = r.token; localStorage.tng_token = TOKEN; ME = r.user;
  document.querySelector('.modal') && document.querySelector('.modal').remove();
  toast('👋 ' + (ME.name || ME.email)); render();
}

/* ================= router ================= */
async function render(){
  markLang();
  const app = document.getElementById('app');
  const p = PAGE;
  const pages = { home: pageHome, stores: pageStores, store: pageStore, casts: pageCasts, cast: pageCast,
    events: pageEvents, coupons: pageCoupons, reviews: pageReviews, blogs: pageBlogs, blog: pageBlog, mypage: pageMypage };
  app.innerHTML = await (pages[p.name] || pageHome)(p.arg);
  const nav = [['home','⌂',t('home')],['stores','🏠',t('find_club')],['casts','👤',t('find_girl')],['events','🎉',t('events')],['coupons','🎫',t('coupons')],['mypage','☰',t('mypage')]];
  document.getElementById('fnav').innerHTML = nav.map(n => `<a class="${p.name===n[0]?'on':''}" href="javascript:go('${n[0]}')"><i>${n[1]}</i>${n[2]}</a>`).join('');
}
(async () => {
  const s = await API('/api/settings');
  if (s.site_name) document.getElementById('sitename').textContent = LANG === 'ja' ? (s.site_name_ja || s.site_name) : LANG === 'zh' ? (s.site_name_zh || s.site_name) : s.site_name;
  render();
})();
</script>
</body>
