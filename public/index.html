<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tokyo Nightlife Guide</title>
<meta name="description" content="Discover the best clubs & nightlife in Tokyo. English & Chinese support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a227;--gold2:#e0c069;--bg:#0b0b0c;--bg2:#141416;--bg3:#1e1e21;--line:#2b2b2f;
  --txt:#efece4;--sub:#9a968c;
  --serif:'Cormorant Garamond','Noto Sans JP','Noto Sans SC',serif;
  --sans:'Noto Sans JP','Noto Sans SC','Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html[lang="zh"] body{--sans:'Noto Sans SC','Noto Sans JP','Helvetica Neue',Arial,sans-serif}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.75;letter-spacing:.02em;padding-bottom:76px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%}
h1,h2,h3{line-height:1.35}
.ic{display:inline-block;vertical-align:-3px;flex:none}
/* ---- header ---- */
.hdr{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.14em;cursor:pointer;color:var(--txt)}
.logo span{color:var(--gold)}
.langs{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--line);border-radius:24px;padding:3px}
.langs button{background:none;border:0;color:var(--sub);padding:7px 13px;border-radius:18px;font-size:12px;font-weight:500;letter-spacing:.05em;cursor:pointer;font-family:var(--sans);min-height:34px}
.langs button.on{background:var(--gold);color:#111;font-weight:700}
/* ---- hero ---- */
.hero{position:relative;padding:76px 22px 52px;text-align:center;background:linear-gradient(180deg,#171410,#0b0b0c)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,162,39,.16),transparent 62%)}
.hero h1{position:relative;font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:.06em;color:#f3ead2}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{position:relative;color:var(--sub);margin-top:14px;font-size:13px;letter-spacing:.08em}
.hero .rule{position:relative;width:56px;height:1px;background:var(--gold);margin:20px auto 0;opacity:.7}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* ---- search ---- */
.searchbox{position:relative;margin:-26px auto 0;max-width:660px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 34px rgba(0,0,0,.55)}
.searchbox input[type=text]{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:13px 15px;font-size:15px;font-family:var(--sans)}
.searchbox input:focus,.filters select:focus{outline:1px solid var(--gold)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filters select{flex:1;min-width:120px;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:13px;font-family:var(--sans);min-height:42px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);color:var(--sub);border-radius:22px;padding:9px 14px;font-size:12px;cursor:pointer;min-height:38px}
.chip.on{border-color:var(--gold);color:var(--gold2)}
/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(120deg,#d4af37,#b08d1e);color:#141414;font-weight:700;border:0;border-radius:10px;padding:13px 22px;font-size:14px;letter-spacing:.06em;cursor:pointer;text-align:center;font-family:var(--sans)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.sm{padding:9px 15px;font-size:12px;min-height:40px}
/* ---- sections / cards ---- */
.sec{margin:42px 0}
.sec h2{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.08em}
.sec h2 em{color:var(--gold);font-style:normal;margin-right:8px}
.sec .more{color:var(--sub);font-size:12px;float:right;margin-top:10px;cursor:pointer;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:10px}.hero h1{font-size:29px}}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.ph{height:158px;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px;font-weight:600;color:rgba(255,255,255,.88);background-size:cover;background-position:center}
.ph .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.62);border:1px solid var(--gold);color:var(--gold2);font-size:10px;font-family:var(--sans);padding:3px 9px;border-radius:12px;letter-spacing:.08em}
.card .bd{padding:13px 14px 14px}
.card h3{font-size:15px;font-weight:700;letter-spacing:.03em}
.meta{color:var(--sub);font-size:11.5px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{color:var(--gold);font-size:12px;letter-spacing:2.5px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);border-radius:6px;padding:3px 8px;font-size:10.5px;color:var(--sub);margin:3px 3px 0 0;letter-spacing:.03em}
.tag.g{color:var(--gold2);border:1px solid #3a3220;background:rgba(201,162,39,.07)}
.row{display:flex;gap:8px;margin-top:11px}
.row .btn{flex:1}
/* ---- detail ---- */
.detail-hero{height:230px;display:flex;align-items:flex-end;padding:20px;position:relative;background-size:cover;background-position:center}
.detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(11,11,12,.9))}
.detail-hero>div{position:relative;z-index:1}
.detail-hero h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.05em}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:18px;-webkit-overflow-scrolling:touch}
.tabs button{background:none;border:0;color:var(--sub);padding:12px 15px;font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-family:var(--sans);letter-spacing:.04em;min-height:44px}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.panel{padding:18px 0;font-size:14px;line-height:1.9;color:#d9d4c7}
.kv{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--sub)}
.review{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}
.review .h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.review .who{font-size:11.5px;color:var(--sub)}
/* ---- fixed CTA / nav ---- */
.fixed-cta{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(12,12,13,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.fixed-cta .btn{flex:1;padding:13px 8px;font-size:13px}
.footer-nav{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;background:#0e0e10;border-top:1px solid var(--line)}
.footer-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 calc(9px + env(safe-area-inset-bottom));font-size:9.5px;letter-spacing:.05em;color:var(--sub)}
.footer-nav a.on{color:var(--gold)}
/* ---- back button ---- */
.backlink{display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:24px;padding:10px 18px;font-size:13px;cursor:pointer;margin:14px 0 0;min-height:44px;font-family:var(--sans)}
.backlink:hover{border-color:var(--gold);color:var(--gold2)}
/* ---- modal / misc ---- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:430px;max-height:85vh;overflow:auto}
.modal h3{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:14px;letter-spacing:.05em}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;color:var(--sub);margin-bottom:5px;letter-spacing:.05em}
.field input,.field textarea,.field select{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:11px;font-size:14px;font-family:var(--sans)}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--gold);color:#141414;padding:11px 24px;border-radius:26px;font-size:13px;font-weight:700;z-index:200;letter-spacing:.04em}
.msg-bubble{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:9px 0;font-size:13px}
.msg-bubble .tr{color:var(--sub);font-size:11px;border-top:1px dashed var(--line);margin-top:7px;padding-top:7px}
.big-rating{font-family:var(--serif);font-size:46px;font-weight:600;color:var(--gold)}
.empty{color:var(--sub);text-align:center;padding:34px;font-size:13px}
.sns-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.map-frame{width:100%;height:240px;border:0;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
footer{border-top:1px solid var(--line);margin-top:56px;padding:34px 16px;color:var(--sub);font-size:11.5px;text-align:center;letter-spacing:.08em}
footer .logo{font-size:15px}
</style>
</head>

function modal(html){ const m = document.createElement('div'); m.className = 'modal'; m.onclick = e => { if (e.target === m) m.remove(); }; m.innerHTML = `<div class="box">${html}</div>`; document.body.appendChild(m); return m; }

/* ---- navigation with history (戻る対応) ---- */
let HIST = [{ name: 'home' }];
let PAGE = HIST[0];
function go(name, arg){ PAGE = { name, arg }; HIST.push(PAGE); try { history.pushState({}, ''); } catch(e){} window.scrollTo(0, 0); render(); }
window.addEventListener('popstate', () => { HIST.pop(); PAGE = HIST[HIST.length - 1] || { name: 'home' }; window.scrollTo(0, 0); render(); });
function goBack(){ if (HIST.length > 1) history.back(); else go('home'); }
const backBtn = () => `<button class="backlink" onclick="goBack()">${ic('back',15)} ${t('back')}</button>`;

function doSearch(sq, sa, sg, sb){
  const p = new URLSearchParams();
  const v = id => document.getElementById(id);
  if (v(sq) && v(sq).value) p.set('q', v(sq).value);
  if (v(sa) && v(sa).value) p.set('area', v(sa).value);
  if (v(sg) && v(sg).value) p.set('genre', v(sg).value);
  if (v(sb) && v(sb).value) p.set('budget', v(sb).value);
  if (v('ce') && v('ce').classList.contains('on')) p.set('lang', 'en');
  if (v('cz') && v('cz').classList.contains('on')) p.set('lang', 'zh');
  if (v('cf') && v('cf').classList.contains('on')) p.set('foreigner', '1');
  if (v('cc') && v('cc').classList.contains('on')) p.set('card', '1');
  go('stores', p.toString());
}

function mapBlock(s){
  if (!s.google_map_url && !s.address) return '';
  let q = null;
  if (s.google_map_url) { const m = /[?&]q=([^&]+)/.exec(s.google_map_url); if (m) q = m[1]; else { const m2 = /maps\/place\/([^/?]+)/.exec(s.google_map_url); if (m2) q = m2[1]; } }
  if (!q && s.address) q = encodeURIComponent(s.address);
  const link = s.google_map_url || ('https://maps.google.com/?q=' + encodeURIComponent(s.address));
  return `${q?`<iframe class="map-frame" loading="lazy" src="https://maps.google.com/maps?q=${q}&output=embed"></iframe>`:''}
    <div class="sns-row"><a class="btn sm ghost" href="${esc(link)}" target="_blank" rel="noopener">${ic('pin',14)} ${t('map')}</a></div>`;
}

  <button class="btn ghost" onclick="go('store',${c.store_id})">${t('visit_club')}</button></div>`;
}
async function pageCasts(){ const cs = await API('/api/casts'); return `<div class="wrap">${backBtn()}<section class="sec"><h2><em>◆</em>${t('find_girl')}</h2><div class="grid">${cs.map(castCard).join('')||`<div class="empty">—</div>`}</div></section></div>`; }
async function pageEvents(){
  const [a, b] = await Promise.all([API('/api/events?when=today'), API('/api/events?when=week')]);
  return `<div class="wrap">${backBtn()}<section class="sec"><h2><em>◆</em>${t('tonight')}</h2><div class="grid">${a.map(eventCard).join('')||`<div class="empty">—</div>`}</div></section>
  <section class="sec"><h2><em>◆</em>${t('this_week')}</h2><div class="grid">${b.map(eventCard).join('')||`<div class="empty">—</div>`}</div></section></div>`;
}
async function pageEvent(id){
  const e = await API('/api/events/' + id);
  if (e.error) return `<div class="wrap">${backBtn()}<div class="empty">—</div></div>`;
  return `<div class="detail-hero" style="${imgStyle(e.image, e.hue)}"><div><h1>${esc(L(e,'title'))}</h1></div></div>
  <div class="wrap">${backBtn()}<section class="sec" style="margin-top:14px">
  <dl class="kv">
    <dt>${t('ev_venue')}</dt><dd><a style="color:var(--gold)" href="javascript:go('store',${e.store_id})">${esc(e['store_name_'+LANG]||e.store_name_en)} →</a></dd>
    <dt>${t('ev_date')}</dt><dd>${esc(e.event_date||'')} ${esc(e.start_time||'')}${e.end_time?' — '+esc(e.end_time):''}</dd>
    ${e.budget_min?`<dt>${t('ev_fee')}</dt><dd>¥${(e.budget_min||0).toLocaleString()}〜¥${(e.budget_max||0).toLocaleString()}</dd>`:''}
  </dl>
  <h2 style="margin-top:22px"><em>◆</em>${t('ev_about')}</h2>
  <div class="panel">${esc(L(e,'desc'))}</div>
  <div class="row" style="max-width:420px"><button class="btn" onclick="go('store',${e.store_id})">${t('visit_club')}</button>
  <button class="btn ghost" onclick="contactStore(${e.store_id},'${esc((e['store_name_'+LANG]||e.store_name_en)).replace(/'/g,'')}')">${ic('message',14)} ${t('contact')}</button></div>
  </section></div>`;
}
async function pageCoupons(){ const cs = await API('/api/coupons'); return `<div class="wrap">${backBtn()}<section class="sec"><h2><em>◆</em>${t('sp_coupons')}</h2><div class="grid">${cs.map(couponCard).join('')||`<div class="empty">—</div>`}</div></section></div>`; }
async function pageReviews(){ const rs = await API('/api/reviews'); const s = await API('/api/reviews/summary'); return `<div class="wrap">${backBtn()}<section class="sec"><h2><em>◆</em>${t('reviews')}</h2><div style="display:flex;align-items:baseline;gap:12px;margin-top:10px"><span class="big-rating">${s.avg}</span><span class="stars" style="font-size:20px">${stars(s.avg)}</span><span style="color:var(--sub)">(${s.cnt})</span></div><div style="margin-top:14px">${rs.map(reviewCard).join('')||`<div class="empty">—</div>`}</div></section></div>`; }
async function pageBlogs(){ const bs = await API('/api/blogs'); return `<div class="wrap">${backBtn()}<section class="sec"><h2><em>◆</em>${t('blog')}</h2><div class="grid">${bs.map(b=>`<div class="card" onclick="go('blog','${b.slug}')"><div class="ph" style="height:118px;${imgStyle(b.image, b.hue)}">${b.image?'':ic('book',32)}</div><div class="bd"><span class="tag g">${esc(b.category||'')}</span><h3 style="margin-top:7px">${esc(L(b,'title'))}</h3><div class="meta">${esc(b.seo_description||'')}</div></div></div>`).join('')}</div></section></div>`; }
async function pageBlog(slug){
  const b = await API('/api/blogs/' + slug);
  if (b.error) return `<div class="wrap">${backBtn()}<div class="empty">—</div></div>`;
  return `<div class="wrap">${backBtn()}<section class="sec">
  <span class="tag g">${esc(b.category||'')}</span><h2 style="font-size:26px;margin-top:10px">${esc(L(b,'title'))}</h2>
  <div class="panel">${esc(L(b,'body')).split('\n').map(p => p.trim() ? `<p style="margin-bottom:13px">${p}</p>` : '').join('')}</div>
  <div style="text-align:center;margin:28px 0"><button class="btn" onclick="go('stores')">${t('find_club')}</button> <button class="btn ghost" onclick="go('coupons')">${t('get_coupon')}</button></div></section></div>`;
}
async function pageMypage(){
  if (!ME) { loginModal(); return `<div class="wrap"><div class="empty">—</div></div>`; }
  const u = await API('/api/me');
  const favStores = u.favorites.filter(f => f.target_type === 'store');
  const favCasts = u.favorites.filter(f => f.target_type === 'cast');
  return `<div class="wrap"><section class="sec"><h2><em>◆</em>${t('mypage')}</h2>
  <div class="meta" style="margin:10px 0">${ic('user',14)} ${esc(u.name||'')} · ${esc(u.email)} ${u.role==='admin'?`· <a href="/admin.html" style="color:var(--gold)">${t('admin')}</a>`:''}</div>
  <button class="btn sm ghost" onclick="localStorage.removeItem('tng_token');TOKEN='';ME=null;go('home')">${t('logout')}</button>
  <h2 style="margin-top:28px"><em>◆</em>${t('my_coupons')}</h2><div class="grid">${u.coupons.map(c=>`<div class="card"><div class="bd"><h3>${esc(L(c,'title'))}</h3><div class="meta">${t('code')}: <b style="color:var(--gold)">${esc(c.code||'')}</b> · ${t('valid')}: ${c.valid_until||'-'}</div></div></div>`).join('')||`<div class="empty">—</div>`}</div>
  <h2 style="margin-top:28px"><em>◆</em>${t('favs')}</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${favStores.map(f=>`<span class="chip" onclick="go('store',${f.target_id})">${ic('home',12)} #${f.target_id}</span>`).join('')}${favCasts.map(f=>`<span class="chip" onclick="go('cast',${f.target_id})">${ic('user',12)} #${f.target_id}</span>`).join('')||''}</div>
  <h2 style="margin-top:28px"><em>◆</em>${t('messages')}</h2>
  ${u.messages.map(m=>`<div class="msg-bubble"><div style="font-size:11px;color:var(--sub)">${m.direction==='user_to_store'?'→':'←'} ${esc((m.created_at||'').slice(0,16))}</div>
    <div>${esc(m['body_'+LANG]||m.body)}</div><div class="tr">${t('original')}: ${esc(m.body)}</div></div>`).join('')||`<div class="empty">—</div>`}
  </section></div>`;
}

/* ================= actions ================= */
function fav(type, id){ if (needLogin()) return; API('/api/favorites', { method:'POST', body: JSON.stringify({ target_type: type, target_id: id }) }).then(() => toast(ic('heart',13))); }
function getCoupon(id){ if (needLogin()) return; API(`/api/coupons/${id}/get`, { method:'POST' }).then(() => toast(t('coupon_saved'))); }
function contactStore(storeId, name, castId){
  if (needLogin()) return;
  const m = modal(`<h3>${esc(name)}</h3>
    <div class="field"><label>${t('message')} (${LANG.toUpperCase()})</label><textarea id="msgbody" rows="4" placeholder="Hello! I'd like to visit tonight."></textarea></div>
    <button class="btn" style="width:100%" onclick="sendMsg(${storeId},${castId||null},this)">${ic('send',14)} ${t('send')}</button>
    <p style="font-size:11px;color:var(--sub);margin-top:11px">${t('translated')}</p>`);
  m.querySelector('textarea').focus();
}
function sendMsg(storeId, castId, btn){
  const body = document.getElementById('msgbody').value.trim(); if (!body) return;
  API('/api/messages', { method:'POST', body: JSON.stringify({ store_id: storeId, cast_id: castId, body }) })
    .then(() => { btn.closest('.modal').remove(); toast(t('msg_sent')); });
}
function reviewModal(storeId){
  modal(`<h3>${t('write_review')}</h3>
    <div class="field"><label>★</label><select id="rv-r">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Name</label><input id="rv-n" value="${esc(ME?ME.name:'')}"></div>
    <div class="field"><label>Title</label><input id="rv-t"></div>
    <div class="field"><label>Review</label><textarea id="rv-b" rows="4"></textarea></div>
    <button class="btn" style="width:100%" onclick="API('/api/reviews',{method:'POST',body:JSON.stringify({store_id:${storeId},rating:+document.getElementById('rv-r').value,author_name:document.getElementById('rv-n').value,title:document.getElementById('rv-t').value,body:document.getElementById('rv-b').value,language:LANG})}).then(()=>{this.closest('.modal').remove();toast(t('review_saved'))})">${t('submit')}</button>`);
}
function loginModal(){
  modal(`<h3>${t('login')} / ${t('register')}</h3>
  <div class="field"><label>Name (${t('register')})</label><input id="au-n"></div>
  <div class="field"><label>Email</label><input id="au-e" type="email"></div>
  <div class="field"><label>Password</label><input id="au-p" type="password"></div>
  <div class="row"><button class="btn" onclick="authDo('login')">${t('login')}</button><button class="btn ghost" onclick="authDo('register')">${t('register')}</button></div>`);
}
async function authDo(mode){
  const body = { email: document.getElementById('au-e').value, password: document.getElementById('au-p').value, name: document.getElementById('au-n').value, language: LANG };
  const r = await API('/api/auth/' + mode, { method:'POST', body: JSON.stringify(body) });
  if (r.error) return toast(r.error);
  TOKEN = r.token; localStorage.tng_token = TOKEN; ME = r.user;
  document.querySelector('.modal') && document.querySelector('.modal').remove();
  toast(ME.name || ME.email); render();
}

/* ================= router ================= */
async function render(){
  markLang();
  const app = document.getElementById('app');
  const p = PAGE;
  const pages = { home: pageHome, stores: pageStores, store: pageStore, casts: pageCasts, cast: pageCast,
    events: pageEvents, event: pageEvent, coupons: pageCoupons, reviews: pageReviews, blogs: pageBlogs, blog: pageBlog, mypage: pageMypage };
  app.innerHTML = await (pages[p.name] || pageHome)(p.arg);
  const nav = [['home','home',t('home')],['stores','search',t('find_club')],['casts','users',t('find_girl')],['events','calendar',t('events')],['coupons','ticket',t('coupons')],['mypage','user',t('mypage')]];
  document.getElementById('fnav').innerHTML = nav.map(n => `<a class="${p.name===n[0]?'on':''}" href="javascript:go('${n[0]}')">${ic(n[1],19)}<span>${n[2]}</span></a>`).join('');
}
function setSiteName(){
  const n = LANG === 'ja' ? (SETTINGS.site_name_ja || SETTINGS.site_name) : LANG === 'zh' ? (SETTINGS.site_name_zh || SETTINGS.site_name) : SETTINGS.site_name;
  if (n) { document.getElementById('sitename').textContent = n; document.getElementById('f_sitename').textContent = n; }
}
(async () => {
  SETTINGS = await API('/api/settings');
  setSiteName();
  document.documentElement.lang = LANG;
  render();
})();
</script>
</body>
</html>
